name: tasty_food
description: App e-commerce de restauration Flutter avec Riverpod

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
flutter:
  uses-material-design: true  # <- AJOUTÉ : Indispensable pour afficher les icônes Material

  assets:
    - assets/images/
    - assets/icons/
    - assets/mock_data/
    - assets/placeholders/